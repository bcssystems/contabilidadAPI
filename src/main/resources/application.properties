spring.application.name=contabilidad
server.port=8887

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/contabilidad
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_ACCESS_EXPIRATION:900000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.security.cookies.secure=${SECURE_COOKIES:false}
app.security.cookies.same-site=${COOKIE_SAME_SITE:Lax}
app.security.cors.origins=${APP_CORS_ORIGINS:https://admon.omisoltec.mx,http://127.0.0.1:5501,http://127.0.0.1:5502}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}
server.forward-headers-strategy=framework
app.upload.dir=${UPLOAD_DIR:uploads/productos}
app.attendance.upload.dir=${ATTENDANCE_UPLOAD_DIR:${app.upload.dir}}
app.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
